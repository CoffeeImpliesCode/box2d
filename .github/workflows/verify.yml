# SPDX-License-Identifier: MIT

# Verification for this fork's Zig package.
#
# This file is written for this repository and names this repository's gates.
# It is entirely fork-authored, and it does not replace or edit upstream's own
# `.github/workflows/build.yml`, which stays in the tree as the record it is:
# upstream's file configures CMake, which this package never runs, and targets
# erincatto's Actions usage including the graphical sample jobs. Nothing here
# publishes anything.
#
# WHAT THIS FILE IS NOT
# ---------------------
# No gate in this package has been run by its author. Nothing here has been
# executed: CI has not run, this repository is local, and nothing in this file
# is a result. Every command below is written down so that the run is well
# defined when it happens; none of them has produced an outcome. The
# authoritative status of every gate is the one table in `README.zig.md`. This
# file must not be edited to imply otherwise.
#
# WHAT IT DOES NOT DO
# -------------------
# * It does not publish. No artifact is uploaded, no release is created, no
#   package is pushed, and `permissions` is `contents: read` so the token cannot
#   write to this repository even by accident.
# * It does not mark any target `continue-on-error` and does not mark any step
#   `|| true`. Nothing here has been observed to fail, and pre-labelling a
#   failure as expected is a claim about a run that never happened. If a target
#   turns out to be unsupported, the fix is to record that here with the
#   compiler output that showed it, not to silence it.
# * It does not exercise a system-library mode. This package has none, and the
#   absence is documented as NOT APPLICABLE in `build.zig` and `README.zig.md`
#   rather than claimed as satisfied.
# * It does not build the samples. They need GLFW, OpenGL, imgui and glad, they
#   are graphical, and `build.zig` records that they are not this package's
#   build.
# * It does not run `cross-test`. The published 53-platform matrix is a harness
#   the driver runs on the development host with its own receipts; a CI runner
#   that cannot execute a target reports a compile, not a test, and a compile
#   reported as a pass is the failure mode this workspace treats most
#   seriously. What CI does carry is the six-target compile-only `check`
#   matrix, whose job name says so.
#
# CACHE AND SCRATCH PLACEMENT
# --------------------------
# `ZIG_FLAGS` puts Zig's local cache in `.zig-cache/` inside the checked-out
# workspace, and the generated C gates go in `$RUNNER_TEMP`. Both are the
# runner's own ephemeral disk: the workspace is the checkout GitHub already
# provisions and `$RUNNER_TEMP` is the per-job scratch directory. Nothing is
# written to `/tmp`, `/var/tmp` or any shared path, and nothing is written
# outside the job. This is deliberately different from the host-side gates,
# which source `$HOME/.local/lib/host-scratch.sh` and use
# `"$HOST_SCRATCH_ROOT/cache/foundation-libs"` (AGENTS.md §6): a GitHub runner is
# not the gruenau host, has no `$HOME/.local/lib`, and must not be pointed at a
# mount it does not have.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_FLAGS: -j8 --summary all --cache-dir .zig-cache

jobs:
  # The pin, the per-file record and upstream's bytes. This job runs before
  # anything is compiled: a package whose provenance does not match is not a
  # package worth building.
  provenance:
    name: upstream pin and integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the record check below can re-derive each
          # digest from the pinned commit's blobs out of this clone's object
          # store rather than from the working tree.
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The real gate, and it runs against a clone. `UPSTREAM.sha256` pins the
      # upstream-owned bytes of this whole repository - 267 files, a wider set
      # than the `.paths` the manifest ships - so this is a repository-root
      # gate. Inside a package fetched by a dependent it would report the 100
      # files that manifest withholds as unreadable; the manifest's `.paths`
      # note and the record's own scope section say so rather than leaving a
      # fetched copy to discover it.
      - name: immutable source integrity
        run: sha256sum -c UPSTREAM.sha256

  static:
    name: static library, tests, example and upstream's own suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Installs zig-out/lib/libbox2d.a, the six headers under
      # zig-out/include/box2d/, zig-out/lib/pkgconfig/box2d.pc, the five
      # licence files under zig-out/share/licenses/box2d/ and
      # zig-out/bin/box2d-benchmark, and compiles the example.
      - name: build and install
        run: zig build $ZIG_FLAGS

      # Every other step in this job reaches Box2D through the Zig facade or
      # through this fork's own tests. These two reach it the way a C program
      # does: the installed public headers, the installed artifact, and the
      # installed pkg-config metadata, with no Zig code at all. None of the
      # others would notice a facade that is correct while the C surface a C
      # caller compiles against is not, and this fork is a C library first.
      #
      # The expectations are derived from the physics, not read back out of
      # this build: a free body under gravity y = y0 - g*t^2/2 with no drag and
      # no contact, and a body resting on static ground that stays there.
      - name: installed C route through pkg-config
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_route_gate.c" <<'C'
          /* The installed Box2D C surface, reached the way a C program reaches
           * it: the six installed public headers under <box2d/>, the installed
           * static archive, and the installed box2d.pc and nothing else. No
           * Zig code, no include path this file chooses, no library other than
           * the one pkg-config named.
           *
           * The scenario is the one upstream documents in docs/hello.md: a
           * static ground box and one dynamic box dropped onto it. The
           * assertions are the physics rather than the code's own output:
           *
           *   - Box2D's default gravity is (0, -10) m/s^2 (src/types.c,
           *     b2DefaultWorldDef), so a body dropped from rest in free fall
           *     for t seconds must fall g*t^2/2 = 5*t^2 metres, to within the
           *     solver's tolerance. That number comes from the acceleration
           *     Box2D documents, not from anything this build printed.
           *   - A box resting on the ground cannot sink below the surface: its
           *     centre must stay at or above groundTop + halfHeight, which is
           *     the contact constraint doing its job.
           *   - A static body has no velocity, which is what "static" means
           *     (include/box2d/types.h:155-157).
           *   - Restitution 0 must remove the bounce: after the box has come to
           *     rest, its speed must not increase.
           */
          #include <box2d/box2d.h>
          #include <box2d/math_functions.h>

          #include <math.h>
          #include <stdio.h>

          static int gFailures = 0;

          static void expect(int condition, const char *what) {
              if (condition) {
                  printf("ok    %s\n", what);
              } else {
                  printf("FAIL  %s\n", what);
                  gFailures += 1;
              }
          }

          int main(void) {
              const float g = 10.0f;      /* Box2D's documented default |gravity| */
              const float dt = 1.0f / 60.0f;
              const float halfWidth = 0.5f;
              const float halfHeight = 0.5f;
              const float groundHalfWidth = 20.0f;
              const float groundHalfHeight = 1.0f;
              const float groundCenterY = -1.0f;

              b2Version version = b2GetVersion();
              printf("box2d %d.%d.%d\n", version.major, version.minor, version.revision);
              expect(version.major == 3, "the linked library is the 3.x ABI this header set describes");
              expect(version.minor == 1 && version.revision == 1, "and it is the pinned 3.1.1");

              /* The ground. Static bodies are the default body type
               * (include/box2d/types.h:155, and b2DefaultBodyDef leaves
               * .type = b2_staticBody), so the definition below is not set to
               * a type on purpose. */
              b2WorldDef worldDef = b2DefaultWorldDef();
              b2WorldId worldId = b2CreateWorld(&worldDef);
              expect(b2World_IsValid(worldId), "a default world was created");

              b2BodyDef groundDef = b2DefaultBodyDef();
              groundDef.position = (b2Vec2){0.0f, groundCenterY};
              b2BodyId groundId = b2CreateBody(worldId, &groundDef);
              expect(b2Body_IsValid(groundId), "the ground body id is live");

              b2ShapeDef groundShapeDef = b2DefaultShapeDef();
              b2Polygon groundBox = b2MakeBox(groundHalfWidth, groundHalfHeight);
              b2ShapeId groundShapeId = b2CreatePolygonShape(groundId, &groundShapeDef, &groundBox);
              expect(b2Shape_IsValid(groundShapeId), "the ground shape was created");

              /* One dynamic box dropped from three metres above the ground's
               * top surface. */
              b2BodyDef bodyDef = b2DefaultBodyDef();
              bodyDef.type = b2_dynamicBody;
              bodyDef.position = (b2Vec2){0.0f, groundCenterY + groundHalfHeight + halfHeight + 3.0f};
              b2BodyId bodyId = b2CreateBody(worldId, &bodyDef);

              b2ShapeDef shapeDef = b2DefaultShapeDef();
              shapeDef.density = 1.0f;
              shapeDef.friction = 0.3f;
              shapeDef.restitution = 0.0f;
              b2Polygon box = b2MakeBox(halfWidth, halfHeight);
              b2ShapeId shapeId = b2CreatePolygonShape(bodyId, &shapeDef, &box);

              expect(b2Shape_IsValid(shapeId), "the falling shape was created");
              expect(b2Body_GetMass(bodyId) > 0.0f,
                     "a dynamic body with a positive-density shape has mass");

              const float startY = b2Body_GetPosition(bodyId).y;

              /* Free fall for 0.25 s, long before it can reach the ground:
               * 15 steps of 1/60 s, and it has fallen less than half a metre in
               * that time, so no contact exists and the only thing acting is
               * gravity. */
              for (int i = 0; i < 15; ++i) {
                  b2World_Step(worldId, dt, 4);
              }

              const float fallen = startY - b2Body_GetPosition(bodyId).y;
              const float expectedFall = 0.5f * g * 0.25f * 0.25f;
              printf("      fell %.6f m in 0.25 s; g*t^2/2 = %.6f m\n",
                     (double)fallen, (double)expectedFall);
              expect(fabsf(fallen - expectedFall) < 0.01f,
                     "free fall matches g*t^2/2 to within 1 cm over 0.25 s");

              b2Vec2 velocity = b2Body_GetLinearVelocity(bodyId);
              expect(fabsf(velocity.y + g * 0.25f) < 0.05f,
                     "the vertical velocity matches g*t to within 0.05 m/s");
              expect(fabsf(velocity.x) < 1e-5f, "gravity did not introduce a horizontal velocity");

              expect(b2Body_GetPosition(groundId).x == 0.0f,
                     "a static body did not move horizontally");
              expect(b2Length(b2Body_GetLinearVelocity(groundId)) == 0.0f,
                     "a static body has no velocity");

              /* Now let it land and settle. */
              for (int i = 0; i < 240; ++i) {
                  b2World_Step(worldId, dt, 4);
              }

              const float restY = b2Body_GetPosition(bodyId).y;
              const float surfaceY = groundCenterY + groundHalfHeight + halfHeight;
              printf("      resting centre y = %.6f m; contact surface = %.6f m\n",
                     (double)restY, (double)surfaceY);
              expect(restY >= surfaceY - 0.01f, "the box did not sink through the ground");
              expect(restY < surfaceY + 0.2f, "and it did not bounce away: restitution is 0");

              b2DestroyWorld(worldId);

              if (gFailures != 0) {
                  printf("%d check(s) failed\n", gFailures);
                  return 1;
              }

              printf("the installed static C route compiled, linked and ran\n");
              return 0;
          }
          C
          PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig" \
            zig cc -std=gnu17 "$RUNNER_TEMP/c_route_gate.c" \
              $(pkg-config --cflags --libs box2d) \
              -o "$RUNNER_TEMP/c_route_gate"
          "$RUNNER_TEMP/c_route_gate"

      # Upstream's own conformance harness, compiled unmodified and run from
      # the entry point upstream's own CI executes as `./bin/test`
      # (.github/workflows/build.yml). This is the only step that reaches
      # `test/main.c`, `shared/` and the vendored enkiTS closure.
      - name: upstream's own suite (test/main.c)
        run: zig build upstream-test $ZIG_FLAGS

      # Debug and ReleaseSafe are the two modes where Zig's safety checks are
      # live. They are run separately because `test` is a real addTest plus
      # addRunArtifact for whatever `-Dtarget` names, and running it once with a
      # forwarded -Doptimize would only re-execute the same binary.
      #
      # ReleaseFast and ReleaseSmall are the other two modes of the four this
      # package is required to build in, and they are run here for the same
      # reason: `NDEBUG` reaches `include/box2d/base.h:101` from the mode, so a
      # mode in which `b2InternalAssertFcn` is not compiled is a different
      # compiled library and has to be built.
      - name: test (Debug)
        run: zig build test -Doptimize=Debug $ZIG_FLAGS
      - name: test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe $ZIG_FLAGS
      - name: test (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast $ZIG_FLAGS
      - name: test (ReleaseSmall)
        run: zig build test -Doptimize=ReleaseSmall $ZIG_FLAGS

      - name: example
        run: zig build smoke $ZIG_FLAGS

      # The two Box2D configuration switches upstream exposes, so the matrix is
      # not silently narrowed to one of them. `-Ddisable-simd` selects the
      # scalar math path at src/core.h:59 and `-Davx2` the 8-wide vector path at
      # src/core.h:65; upstream's default is neither, and upstream's own CI
      # configures `BOX2D_VALIDATE=ON`, which is this package's default.
      #
      # The same two switches are run through `consumer` below, because that is
      # the half of the step that tests forwarding rather than the flag itself:
      # `zig build consumer -Ddisable-simd=true` carries the switch into the
      # nested `consumer/` package, which forwards it to
      # `b.dependency("box2d", ...)`. A dependency that dropped one of them
      # would compile the default library here and still exit zero, and `test`
      # above cannot see it.
      - name: scalar math only
        run: |
          zig build test -Ddisable-simd=true $ZIG_FLAGS
          zig build consumer -Ddisable-simd=true $ZIG_FLAGS
      - name: AVX2 vector width
        run: |
          zig build test -Davx2=true $ZIG_FLAGS
          zig build consumer -Davx2=true $ZIG_FLAGS

  shared:
    name: shared library and its installed C route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # A real shared object with upstream's soname: `libbox2d.so.3.1.1` with
      # `libbox2d.so.3` and `libbox2d.so` beside it, SOVERSION 3 from
      # `src/CMakeLists.txt:95-97`. Installed to a scratch prefix so this job
      # cannot collide with the static job's `zig-out`.
      - name: build and install the shared variant
        run: zig build -Dlinkage=dynamic --prefix "$RUNNER_TEMP/shared" $ZIG_FLAGS

      - name: the installed shared object has upstream's soname
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/shared/lib/libbox2d.so.3.1.1"
          test -f "$RUNNER_TEMP/shared/lib/libbox2d.so.3"
          test -f "$RUNNER_TEMP/shared/lib/libbox2d.so"
          soname=$(readelf -d "$RUNNER_TEMP/shared/lib/libbox2d.so.3.1.1" \
            | sed -n 's/.*SONAME.*\[\(.*\)\]/\1/p')
          echo "SONAME=$soname"
          test "$soname" = "libbox2d.so.3"

      # The export surface is the six public headers and nothing else:
      # `src/CMakeLists.txt:74` sets hidden visibility and `base.h:11-23` is
      # the only thing that widens it, and no declaration under `src/` uses
      # `B2_API`. So a symbol from an internal header appearing in the dynamic
      # symbol table would mean the export policy did not hold.
      - name: the export surface is the public interface only
        run: |
          set -euo pipefail
          readelf --dyn-syms --wide "$RUNNER_TEMP/shared/lib/libbox2d.so.3.1.1" \
            | awk '$5 == "GLOBAL" && $7 != "UND" { print $8 }' | sed 's/@.*//' \
            | sort -u > "$RUNNER_TEMP/exported.txt"
          wc -l < "$RUNNER_TEMP/exported.txt"
          # Every exported name must start with b2: that prefix is Box2D's own
          # (`include/box2d/base.h:49-60` and every B2_API declaration in the
          # six headers), and nothing under src/ declares a non-b2 external.
          if grep -v '^b2' "$RUNNER_TEMP/exported.txt"; then
            echo "::error::a non-b2 symbol is exported" >&2
            exit 1
          fi
          # b2GetVersion is in the public interface (include/box2d/base.h:84),
          # so it must be exported by a shared build.
          grep -qx 'b2GetVersion' "$RUNNER_TEMP/exported.txt"
          grep -qx 'b2World_Step' "$RUNNER_TEMP/exported.txt"

      # The same physics gate, this time against the shared object through the
      # installed pkg-config metadata, so the `-DBOX2D_DLL` in `Cflags` and the
      # shared `.so` symlink in `Libs` are both exercised.
      - name: installed C route against the shared object
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/shared_route_gate.c" <<'C'
          /* The installed Box2D C surface against the installed shared object.
           * Same program shape as the static job's gate: the six installed
           * headers, the installed box2d.pc, and no Zig code. */
          #include <box2d/box2d.h>

          #include <stdio.h>

          int main(void) {
              b2WorldDef worldDef = b2DefaultWorldDef();
              b2WorldId worldId = b2CreateWorld(&worldDef);
              if (!b2World_IsValid(worldId)) {
                  printf("FAIL  the world was not created through the shared object\n");
                  return 1;
              }

              b2BodyDef bodyDef = b2DefaultBodyDef();
              bodyDef.type = b2_dynamicBody;
              b2BodyId bodyId = b2CreateBody(worldId, &bodyDef);
              b2ShapeDef shapeDef = b2DefaultShapeDef();
              b2Polygon box = b2MakeBox(0.5f, 0.5f);
              b2ShapeId shapeId = b2CreatePolygonShape(bodyId, &shapeDef, &box);

              if (!b2Shape_IsValid(shapeId)) {
                  printf("FAIL  the shape was not created through the shared object\n");
                  return 1;
              }

              b2Vec2 start = b2Body_GetPosition(bodyId);
              for (int i = 0; i < 60; ++i) {
                  b2World_Step(worldId, 1.0f / 60.0f, 4);
              }
              b2Vec2 end = b2Body_GetPosition(bodyId);

              b2Version version = b2GetVersion();
              printf("      shared object reports box2d %d.%d.%d; y %.4f -> %.4f\n",
                     version.major, version.minor, version.revision,
                     (double)start.y, (double)end.y);

              b2DestroyWorld(worldId);

              if (!(end.y < start.y)) {
                  printf("FAIL  the body did not fall through the shared object\n");
                  return 1;
              }
              printf("the installed shared C route compiled, linked and ran\n");
              return 0;
          }
          C
          PKG_CONFIG_PATH="$RUNNER_TEMP/shared/lib/pkgconfig" \
            zig cc -std=gnu17 "$RUNNER_TEMP/shared_route_gate.c" \
              -Wl,-rpath,"$RUNNER_TEMP/shared/lib" \
              $(pkg-config --cflags --libs box2d) \
              -o "$RUNNER_TEMP/shared_route_gate"
          "$RUNNER_TEMP/shared_route_gate"

      # The suite still runs under `-Dlinkage=dynamic`, because upstream's own
      # rule is that the unit tests exist only for a static build
      # (`CMakeLists.txt:100-104`). This build satisfies that by linking the
      # upstream suite against a static core of the same 35 sources regardless
      # of `-Dlinkage`, rather than by not running it here.
      - name: upstream's own suite under -Dlinkage=dynamic
        run: zig build upstream-test -Dlinkage=dynamic $ZIG_FLAGS

  cross:
    name: check ${{ matrix.target }} (compile only, nothing runs)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos-none
          - x86_64-windows-gnu
          - riscv64-linux-gnu
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Compiles the 35-file C core, the facade, `tests.zig`, `smoke.zig`,
      # upstream's own `test/` suite and the benchmark tool for this target.
      # Running nothing: a compile is not a test result, and this job's name
      # says so.
      #
      # Two of those artifacts are not compiled for `wasm32-wasi`, and
      # `build.zig` prints that on its configure line with the reason
      # (`extern/enkiTS/src/TaskScheduler.h:22` includes `<thread>`, and Zig's
      # WASI C++ library has no threads). Every other artifact, including the
      # full C core, is compiled for it. `build.zig`'s output is echoed here so
      # the boundary is visible in this job's log rather than only in a file.
      - name: Compile the full library and public API
        run: |
          set -euo pipefail
          zig build check -Dtarget=${{ matrix.target }} $ZIG_FLAGS 2>&1 | tee "$RUNNER_TEMP/check.log"

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The proof that the published module resolves from a package that did not
      # write it: a module that builds from the inside and does not resolve from
      # outside would pass every other job here. The consumer uses
      # dep.module("box2d") and no dep.artifact, by relative path, so the proof
      # does not depend on a published state of the world.
      - name: Build and run the consumer
        working-directory: consumer
        run: zig build run $ZIG_FLAGS
